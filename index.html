<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Space Defender</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    canvas {
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4 font-sans">

  <!-- Main Container -->
  <div class="max-w-4xl w-full flex flex-col items-center gap-4">
    
    <!-- Title & Stats Header -->
    <header class="w-full flex justify-between items-center bg-slate-900/80 border border-slate-800 p-4 rounded-xl shadow-lg">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
        Space Defender
      </h1>
      <div class="flex gap-6 text-sm font-semibold">
        <div>Score: <span id="scoreText" class="text-cyan-400">0</span></div>
        <div>Lives: <span id="livesText" class="text-red-400">3</span></div>
      </div>
    </header>

    <!-- Canvas Game Viewport -->
    <div class="relative border-2 border-indigo-500/30 rounded-2xl overflow-hidden shadow-2xl shadow-indigo-500/10">
      <canvas id="gameCanvas" width="700" height="450"></canvas>

      <!-- Start Game Modal Overlay with Leaderboard -->
      <div id="startModal" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
        <h2 class="text-3xl font-extrabold text-cyan-400 mb-1">SPACE DEFENDER</h2>
        <p class="text-slate-400 mb-4 max-w-sm text-xs">Use arrow keys to move and spacebar to shoot. Destroy meteors to score points!</p>
        
        <!-- Live Leaderboard Container -->
        <div class="w-full max-w-xs bg-slate-900/80 border border-slate-800 rounded-xl p-3 mb-4 text-left shadow-inner">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 text-center">🏆 High Scores</h3>
          <div id="leaderboardList" class="space-y-1 text-xs">
            <div class="text-slate-500 text-center py-1">Loading scores...</div>
          </div>
        </div>

        <button id="startBtn" class="px-8 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-cyan-500/20 transition transform hover:scale-105">
          Start Game
        </button>
      </div>

      <!-- Game Over Modal Overlay -->
      <div id="gameOverModal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
        <h2 class="text-4xl font-extrabold text-red-500 mb-2">GAME OVER</h2>
        <p class="text-slate-400 mb-4">Final Score: <span id="finalScore" class="text-white font-bold">0</span></p>

        <div class="flex gap-2 mb-6">
          <input type="text" id="playerName" placeholder="Enter Name" class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
          <button id="saveScoreBtn" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 font-bold rounded-lg transition">Save</button>
        </div>

        <button id="restartBtn" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl shadow-lg transition">
          Play Again
        </button>
      </div>
    </div>

    <!-- Controls Footer -->
    <footer class="w-full bg-slate-900/60 border border-slate-800/80 p-3 rounded-xl flex justify-between text-xs text-slate-400">
      <div>Controls: <span class="text-slate-200">← → Keys</span> to Move | <span class="text-slate-200">Spacebar</span> to Shoot</div>
      <div>Frontend: JS/HTML5 | Backend: Node.js + SQLite</div>
    </footer>
  </div>

  <!-- External JavaScript File -->
  <script src="game.js"></script>
</body>
</html>
